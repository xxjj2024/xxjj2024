<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 344" width="100%" height="100%" style="background-color:#04060D; font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', sans-serif;">
    
    <defs>
        <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="4" y2="0" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
        </pattern>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="40" height="40" fill="none" stroke="#22E1FF" stroke-opacity="0.06" stroke-width="1"/>
        </pattern>
    </defs>
    
    <rect width="1200" height="344" fill="#04060D" />
    <rect width="1200" height="344" fill="url(#grid)" />
    
    <!-- 左侧终端面板 -->
    <rect x="24" y="24" width="680" height="296" rx="14" fill="#0A0F1A" stroke="#1B2740" stroke-width="1"/>
    <circle cx="44" cy="44" r="5" fill="#FF2FA8"/>
    <circle cx="60" cy="44" r="5" fill="#FFC247"/>
    <circle cx="76" cy="44" r="5" fill="#A8FF5E"/>
    <text x="364" y="48" fill="#6F84A6" font-size="12" text-anchor="middle">jasmine@os: ~</text>
    <line x1="24" y1="64" x2="704" y2="64" stroke="#1B2740" stroke-width="1"/>
    
    <g font-size="14" transform="translate(44, 96)">
        <text y="0" fill="#A8FF5E">$ <tspan fill="#FFF">whoami</tspan></text>
        <text y="24" fill="#6F84A6">JasmineX  ·  embedded firmware / motion control</text>
        
        <text y="64" fill="#A8FF5E">$ <tspan fill="#FFF">cat focus.txt</tspan></text>
        <text y="88" fill="#6F84A6">STM32 固件 · 闭环步进 · 舵机云台 · ROS2 底盘</text>
        
        <text y="128" fill="#A8FF5E">$ <tspan fill="#FFF">ls ~/lab</tspan></text>
        <text y="152" fill="#22E1FF">laser-cannon/   stepper-57/   library-sys/   video-lab/</text>
        
        <text y="192" fill="#A8FF5E">$ <tspan fill="#FFF">git log -1 --oneline</tspan></text>
        <text y="216" fill="#6F84A6"><tspan fill="#FFC247">9c1f2ab</tspan> polish: PWM jitter 12us -&gt; 2us</text>
    </g>

    <!-- 右侧 Boot Log 面板 (逐渐亮起) -->
    <rect x="728" y="24" width="448" height="296" rx="14" fill="#0A0F1A" stroke="#1B2740" stroke-width="1"/>
    <g font-size="13" transform="translate(748, 64)" fill="#6F84A6">
    
        <text y="0" fill="#6F84A6" opacity="0">
            [ 0.000] jasmine-os 2.6 boot
            <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.0s" fill="freeze" />
        </text>
        
        <text y="26" fill="#6F84A6" opacity="0">
            [ 0.041] cpu: cortex-m4 @ 168MHz
            <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.13s" fill="freeze" />
        </text>
        
        <text y="52" fill="#6F84A6" opacity="0">
            [ 0.082] can0: 500 kbit/s online
            <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.26s" fill="freeze" />
        </text>
        
        <text y="78" fill="#6F84A6" opacity="0">
            [ 0.123] i2c: oled 0x3c ack
            <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.39s" fill="freeze" />
        </text>
        
        <text y="104" fill="#6F84A6" opacity="0">
            [ 0.164] pwm: tim3 ch1..ch4 armed
            <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.52s" fill="freeze" />
        </text>
        
        <text y="130" fill="#6F84A6" opacity="0">
            [ 0.205] fs: mount /lab ok
            <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.65s" fill="freeze" />
        </text>
        
        <text y="156" fill="#6F84A6" opacity="0">
            [ 0.246] net: ros2 agent up
            <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.78s" fill="freeze" />
        </text>
        
        <text y="182" fill="#6F84A6" opacity="0">
            [ 0.287] theme: neon loaded
            <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.91s" fill="freeze" />
        </text>
        
        <text y="208" fill="#A8FF5E" opacity="0">
            [ 0.328] ready for input_
            <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.04s" fill="freeze" />
        </text>
        </g>
    <rect width="1200" height="344" fill="url(#scanlines)" pointer-events="none" />
    <!-- HUD Corners -->
    <path d="M 14,0 L 0,0 L 0,14 M 1186,0 L 1200,0 L 1200,14 M 1186,344 L 1200,344 L 1200,330 M 14,344 L 0,344 L 0,330" fill="none" stroke="#1B2740" stroke-width="2" />
    </svg>