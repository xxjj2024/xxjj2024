<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 344" width="100%" height="100%" style="background-color:#04060D; font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', sans-serif;">
    
    <defs>
        <!-- 泛光滤镜 -->
        <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <!-- 沉浸式渐变遮罩 (用于平滑折线图) -->
        <linearGradient id="grad-cyan" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#22E1FF" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#22E1FF" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="grad-magenta" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FF2FA8" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#FF2FA8" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#A8FF5E" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#A8FF5E" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="grad-yellow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFC247" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#FFC247" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8B5CFF" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#8B5CFF" stop-opacity="0.0"/>
        </linearGradient>
        
        <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="4" y2="0" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
        </pattern>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="40" height="40" fill="none" stroke="#22E1FF" stroke-opacity="0.03" stroke-width="1"/>
        </pattern>
        <!-- 十六进制内存流底纹 (双副本保证 300px 无缝滚动) -->
        <pattern id="hex-rain" width="300" height="300" patternUnits="userSpaceOnUse">
            <g fill="#22E1FF" opacity="0.04" font-size="9" font-family="'JetBrains Mono', Consolas" letter-spacing="2">
                <text x="20" y="20">0x0800 0x1A2B 0x3C4D 0x5E6F</text>
                <text x="80" y="80">0x2000 0xDEAD 0xBEEF 0x0000</text>
                <text x="150" y="140">0x4002 0x8899 0xAABB 0xCCDD</text>
                <text x="40" y="220">0x8000 0x1122 0x3344 0x5566</text>
                <text x="200" y="280">0x0000 0xFFFF 0x0000 0xFFFF</text>
                <text x="20" y="-280">0x0800 0x1A2B 0x3C4D 0x5E6F</text>
                <text x="80" y="-220">0x2000 0xDEAD 0xBEEF 0x0000</text>
                <text x="150" y="-160">0x4002 0x8899 0xAABB 0xCCDD</text>
                <text x="40" y="-80">0x8000 0x1122 0x3344 0x5566</text>
                <text x="200" y="-20">0x0000 0xFFFF 0x0000 0xFFFF</text>
                <animateTransform attributeName="transform" type="translate" from="0,0" to="0,300" dur="20s" repeatCount="indefinite"/>
            </g>
        </pattern>
    </defs>
    
    <rect width="1200" height="344" fill="#04060D" />
    <!-- 巨型工业背景水印 -->
    <text x="600.0" y="272.0" fill="#FFFFFF" font-size="275.2" font-weight="900" font-family="Arial, Helvetica, sans-serif" opacity="0.02" text-anchor="middle" letter-spacing="-10">03</text>
    
    <!-- 全局微距网格与内存流 -->
    <rect width="1200" height="344" fill="url(#hex-rain)" />
    <rect width="1200" height="344" fill="url(#grid)" />
    
    <!-- 取景器物理边框 -->
    <rect x="8" y="8" width="1184" height="328" fill="none" stroke="#1B2740" stroke-width="1.5"/>
    <!-- 四角重装甲锁定框 -->
    <path d="M 8,40 L 8,8 L 40,8 M 1160,8 L 1192,8 L 1192,40 M 8,304 L 8,336 L 40,336 M 1160,336 L 1192,336 L 1192,304" fill="none" stroke="#22E1FF" stroke-width="2.5" opacity="0.7"/>
    
    <!-- 顶部状态栏元数据 -->
    <text x="18" y="22" fill="#6F84A6" font-size="9" letter-spacing="1">SYS.MNTR // LIVE FEED</text>
    <circle cx="1155" cy="18" r="3.5" fill="#FF2FA8">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="1165" y="22" fill="#FF2FA8" font-size="9" font-weight="bold" letter-spacing="1">REC</text>
    <text x="1135" y="22" fill="#6F84A6" font-size="9" text-anchor="end">UPLINK_ESTABLISHED</text>
    
    
    <!-- 左侧终端面板 -->
    <rect x="24" y="24" width="680" height="296" rx="12" fill="#0A0F1A" stroke="#1B2740" stroke-width="1"/>
    <circle cx="44" cy="44" r="5" fill="#FF2FA8"/>
    <circle cx="60" cy="44" r="5" fill="#FFC247"/>
    <circle cx="76" cy="44" r="5" fill="#A8FF5E"/>
    <text x="364" y="48" fill="#6F84A6" font-size="12" text-anchor="middle">jasmine@os: ~</text>
    <line x1="24" y1="64" x2="704" y2="64" stroke="#1B2740" stroke-width="1"/>
    
    <g font-size="14" transform="translate(44, 96)">
        <text y="0" fill="#A8FF5E">$ <tspan fill="#FFF">whoami</tspan></text>
        <text y="24" fill="#6F84A6">JasmineX  ·  embedded firmware / motion control</text>
        
        <text y="64" fill="#A8FF5E">$ <tspan fill="#FFF">cat focus.txt</tspan></text>
        <text y="88" fill="#6F84A6">STM32 固件 · 闭环步进 · 舵机云台 · ROS2 底盘</text>
        
        <text y="128" fill="#A8FF5E">$ <tspan fill="#FFF">ls ~/lab</tspan></text>
        <text y="152" fill="#22E1FF">laser-cannon/   stepper-57/   library-sys/   video-lab/</text>
        
        <text y="192" fill="#A8FF5E">$ <tspan fill="#FFF">git log -1 --oneline</tspan></text>
        <text y="216" fill="#6F84A6"><tspan fill="#FFC247">9c1f2ab</tspan> polish: PWM jitter 12us -&gt; 2us</text>
    </g>
    <rect x="728" y="24" width="228" height="296" rx="12" fill="#0A0F1A" stroke="#1B2740" stroke-width="1"/>
    <text x="740" y="48" fill="#6F84A6" font-size="8" letter-spacing="1">BOOT.LOG // KERNEL</text>
    <line x1="740" y1="288" x2="944" y2="288" stroke="#1B2740" stroke-width="1"/>
    <text x="740" y="302" fill="#6F84A6" font-size="8" letter-spacing="1">BUFFER 09/256 // ERR 0</text>
    <g font-size="12" transform="translate(740, 60)" fill="#6F84A6"><text y="0" fill="#6F84A6" opacity="0">[ 0.00] jasmine_os boot<animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.0s" fill="freeze" /></text><text y="24" fill="#6F84A6" opacity="0">[ 0.04] mcu_core: OK<animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.15s" fill="freeze" /></text><text y="48" fill="#6F84A6" opacity="0">[ 0.08] bus_init: OK<animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.3s" fill="freeze" /></text><text y="72" fill="#A8FF5E" opacity="0">[ 0.12] ros2_node: ONLINE<animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.44999999999999996s" fill="freeze" /></text><text y="96" fill="#FFC247" opacity="0">[ 0.16] qwen2.5: STANDBY<animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.6s" fill="freeze" /></text><text y="120" fill="#6F84A6" opacity="0">[ 0.24] fs_mount: /lab OK<animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.75s" fill="freeze" /></text><text y="144" fill="#6F84A6" opacity="0">[ 0.28] -------------<animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.8999999999999999s" fill="freeze" /></text><text y="168" fill="#6F84A6" opacity="0">[ 0.32] init: haloflux.js<animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.05s" fill="freeze" /></text><text y="192" fill="#A8FF5E" opacity="0">[ 0.36] ready for input_<animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.2s" fill="freeze" /></text></g>
    <g transform="translate(972, 24)">
        <rect x="0" y="0" width="204" height="296" rx="12" fill="#0A0F1A" stroke="#1B2740" stroke-width="1"/>
        <text x="12" y="24" fill="#22E1FF" font-size="10" font-weight="bold">AGENT // HALOFLUX</text>
        <line x1="12" y1="32" x2="192" y2="32" stroke="#1B2740" stroke-width="1"/>
        
        <!-- GLM-5.3 WS/SSE 流式节点模型 -->
        <circle cx="102" cy="110" r="30" fill="none" stroke="#FF2FA8" stroke-width="1" stroke-dasharray="2 4">
             <animateTransform attributeName="transform" type="rotate" from="0 102 110" to="360 102 110" dur="10s" repeatCount="indefinite"/>
        </circle>
        <circle cx="102" cy="110" r="15" fill="#04060D" stroke="#FF2FA8" stroke-width="2" filter="url(#glow-magenta)"/>
        <text x="102" y="113" fill="#FFFFFF" font-size="9" font-weight="bold" text-anchor="middle">GLM</text>
        
        <!-- DOM-Canvas 混合渲染数据流 -->
        <path d="M 102,140 L 102,190" fill="none" stroke="#22E1FF" stroke-width="1.5" stroke-dasharray="4 4">
            <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/>
        </path>
        <rect x="52" y="190" width="100" height="30" rx="4" fill="none" stroke="#22E1FF" stroke-width="1"/>
        <text x="102" y="209" fill="#22E1FF" font-size="9" text-anchor="middle">DOM/CANVAS SYNC</text>
        <text x="102" y="245" fill="#6F84A6" font-size="8" letter-spacing="1" text-anchor="middle">60FPS // HYBRID</text>
        
        <circle cx="16" cy="270" r="3" fill="#A8FF5E"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
        <text x="26" y="273" fill="#6F84A6" font-size="9">WS/SSE: CONNECTED</text>
    </g>
    
    <rect width="1200" height="344" fill="url(#scanlines)" pointer-events="none" />
    </svg>