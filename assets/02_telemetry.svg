                <animate attributeName="stroke-dashoffset" from="188.5" to="169.65" dur="2.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
            </circle>
            <!-- 中心跳动的真实数据 -->
            <text x="0" y="5" fill="#FFFFFF" font-size="16" font-family="'JetBrains Mono', Consolas" font-weight="bold" text-anchor="middle">
                5
                <!-- 数字加载闪烁错觉 -->
                <animate attributeName="opacity" values="0;1;0.5;1" dur="1s" repeatCount="1" fill="freeze"/>
            </text>
        </g>
        
        <g transform="translate(825, 70)">
            <text x="0" y="-45" fill="#6F84A6" font-size="10" font-weight="bold" letter-spacing="1" text-anchor="middle">RUNTIME.STARS</text>
            <!-- 环形底圈 -->
            <circle cx="0" cy="0" r="30" fill="none" stroke="#1B2740" stroke-width="4"/>
            <!-- 动态注入的数据进度圈 -->
            <circle cx="0" cy="0" r="30" fill="none" stroke="#FFC247" stroke-width="4" stroke-dasharray="188.5" stroke-dashoffset="188.5" transform="rotate(-90)" stroke-linecap="round">
                <animate attributeName="stroke-dashoffset" from="188.5" to="140.244" dur="2.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
            </circle>
            <!-- 中心跳动的真实数据 -->
            <text x="0" y="5" fill="#FFFFFF" font-size="16" font-family="'JetBrains Mono', Consolas" font-weight="bold" text-anchor="middle">
                128
                <!-- 数字加载闪烁错觉 -->
                <animate attributeName="opacity" values="0;1;0.5;1" dur="1s" repeatCount="1" fill="freeze"/>
            </text>
        </g>
        
        <g transform="translate(1050, 70)">
            <text x="0" y="-45" fill="#6F84A6" font-size="10" font-weight="bold" letter-spacing="1" text-anchor="middle">COMMITS.YTD</text>
            <!-- 环形底圈 -->
            <circle cx="0" cy="0" r="30" fill="none" stroke="#1B2740" stroke-width="4"/>
            <!-- 动态注入的数据进度圈 -->
            <circle cx="0" cy="0" r="30" fill="none" stroke="#8B5CFF" stroke-width="4" stroke-dasharray="188.5" stroke-dashoffset="188.5" transform="rotate(-90)" stroke-linecap="round">
                <animate attributeName="stroke-dashoffset" from="188.5" to="94.25" dur="2.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
            </circle>
            <!-- 中心跳动的真实数据 -->
            <text x="0" y="5" fill="#FFFFFF" font-size="16" font-family="'JetBrains Mono', Consolas" font-weight="bold" text-anchor="middle">
                1024
                <!-- 数字加载闪烁错觉 -->
                <animate attributeName="opacity" values="0;1;0.5;1" dur="1s" repeatCount="1" fill="freeze"/>
            </text>
        </g>
        
    <rect width="1200" height="130" fill="url(#scanlines)" pointer-events="none" />
    <!-- HUD Corners -->
    <path d="M 14,0 L 0,0 L 0,14 M 1186,0 L 1200,0 L 1200,14 M 1186,130 L 1200,130 L 1200,116 M 14,130 L 0,130 L 0,116" fill="none" stroke="#1B2740" stroke-width="2" />
    </svg>