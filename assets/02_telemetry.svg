<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="100%" height="100%" style="background-color:#04060D; font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', sans-serif;">
    
    <defs>
        <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="4" y2="0" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
        </pattern>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="40" height="40" fill="none" stroke="#22E1FF" stroke-opacity="0.06" stroke-width="1"/>
        </pattern>
    </defs>
    
    <rect width="1200" height="130" fill="#04060D" />
    <rect width="1200" height="130" fill="url(#grid)" />
    
    <path id="data-track" d="M 24,10 L 1176,10" fill="none" stroke="#22E1FF" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 4"/>
    <circle r="3" fill="#FFC247" filter="url(#glow-cyan)">
        <animateMotion dur="8s" repeatCount="indefinite">
            <mpath href="#data-track"/>
        </animateMotion>
    </circle>
    
        <g transform="translate(150, 70)">
            <text x="0" y="-45" fill="#6F84A6" font-size="10" font-weight="bold" letter-spacing="1" text-anchor="middle">SYS.FOLLOWERS</text>
            <!-- 环形底圈 -->
            <circle cx="0" cy="0" r="30" fill="none" stroke="#1B2740" stroke-width="4"/>
            <!-- 动态注入的数据进度圈 -->
            <circle cx="0" cy="0" r="30" fill="none" stroke="#22E1FF" stroke-width="4" stroke-dasharray="188.5" stroke-dashoffset="188.5" transform="rotate(-90)" stroke-linecap="round">
                <animate attributeName="stroke-dashoffset" from="188.5" to="180.96" dur="2.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
            </circle>
            <!-- 中心跳动的真实数据 -->
            <text x="0" y="5" fill="#FFFFFF" font-size="16" font-family="'JetBrains Mono', Consolas" font-weight="bold" text-anchor="middle">
                4
                <!-- 数字加载闪烁错觉 -->
                <animate attributeName="opacity" values="0;1;0.5;1" dur="1s" repeatCount="1" fill="freeze"/>
            </text>
        </g>
        
        <g transform="translate(375, 70)">
            <text x="0" y="-45" fill="#6F84A6" font-size="10" font-weight="bold" letter-spacing="1" text-anchor="middle">REPO.PUBLIC</text>
            <!-- 环形底圈 -->
            <circle cx="0" cy="0" r="30" fill="none" stroke="#1B2740" stroke-width="4"/>
            <!-- 动态注入的数据进度圈 -->
            <circle cx="0" cy="0" r="30" fill="none" stroke="#FF2FA8" stroke-width="4" stroke-dasharray="188.5" stroke-dashoffset="188.5" transform="rotate(-90)" stroke-linecap="round">
                <animate attributeName="stroke-dashoffset" from="188.5" to="150.8" dur="2.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
            </circle>
            <!-- 中心跳动的真实数据 -->
            <text x="0" y="5" fill="#FFFFFF" font-size="16" font-family="'JetBrains Mono', Consolas" font-weight="bold" text-anchor="middle">
                10
                <!-- 数字加载闪烁错觉 -->
                <animate attributeName="opacity" values="0;1;0.5;1" dur="1s" repeatCount="1" fill="freeze"/>
            </text>
        </g>
        
        <g transform="translate(600, 70)">
            <text x="0" y="-45" fill="#6F84A6" font-size="10" font-weight="bold" letter-spacing="1" text-anchor="middle">SYS.FOLLOWING</text>
            <!-- 环形底圈 -->
            <circle cx="0" cy="0" r="30" fill="none" stroke="#1B2740" stroke-width="4"/>
