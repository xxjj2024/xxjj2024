<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" style="background-color:#04060D; font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', sans-serif;">
    
    <defs>
        <!-- 泛光滤镜 -->
        <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <!-- 沉浸式渐变遮罩 (用于平滑折线图) -->
        <linearGradient id="grad-cyan" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#22E1FF" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#22E1FF" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="grad-magenta" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FF2FA8" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#FF2FA8" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#A8FF5E" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#A8FF5E" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="grad-yellow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFC247" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#FFC247" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8B5CFF" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#8B5CFF" stop-opacity="0.0"/>
        </linearGradient>
        
        <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="4" y2="0" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
        </pattern>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="40" height="40" fill="none" stroke="#22E1FF" stroke-opacity="0.03" stroke-width="1"/>
        </pattern>
        <!-- 十六进制内存流底纹 (双副本保证 300px 无缝滚动) -->
        <pattern id="hex-rain" width="300" height="300" patternUnits="userSpaceOnUse">
            <g fill="#22E1FF" opacity="0.04" font-size="9" font-family="'JetBrains Mono', Consolas" letter-spacing="2">
                <text x="20" y="20">0x0800 0x1A2B 0x3C4D 0x5E6F</text>
                <text x="80" y="80">0x2000 0xDEAD 0xBEEF 0x0000</text>
                <text x="150" y="140">0x4002 0x8899 0xAABB 0xCCDD</text>
                <text x="40" y="220">0x8000 0x1122 0x3344 0x5566</text>
                <text x="200" y="280">0x0000 0xFFFF 0x0000 0xFFFF</text>
                <text x="20" y="-280">0x0800 0x1A2B 0x3C4D 0x5E6F</text>
                <text x="80" y="-220">0x2000 0xDEAD 0xBEEF 0x0000</text>
                <text x="150" y="-160">0x4002 0x8899 0xAABB 0xCCDD</text>
                <text x="40" y="-80">0x8000 0x1122 0x3344 0x5566</text>
                <text x="200" y="-20">0x0000 0xFFFF 0x0000 0xFFFF</text>
                <animateTransform attributeName="transform" type="translate" from="0,0" to="0,300" dur="20s" repeatCount="indefinite"/>
            </g>
        </pattern>
    </defs>
    
    <rect width="1200" height="340" fill="#04060D" />
    <!-- 巨型工业背景水印 -->
    <text x="600.0" y="270.0" fill="#FFFFFF" font-size="272.0" font-weight="900" font-family="Arial, Helvetica, sans-serif" opacity="0.02" text-anchor="middle" letter-spacing="-10">04</text>
    
    <!-- 全局微距网格与内存流 -->
    <rect width="1200" height="340" fill="url(#hex-rain)" />
    <rect width="1200" height="340" fill="url(#grid)" />
    
    <!-- 取景器物理边框 -->
    <rect x="8" y="8" width="1184" height="324" fill="none" stroke="#1B2740" stroke-width="1.5"/>
