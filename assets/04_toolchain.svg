        <rect x="570" y="140" width="60" height="40" fill="#04060D" stroke="#22E1FF" stroke-width="2"/>
        <circle cx="578" cy="148" r="2" fill="#FFC247"/>
        <text x="600" y="158" fill="#22E1FF" font-size="8" font-weight="bold" text-anchor="middle">JASMINE</text>
        <text x="600" y="170" fill="#6F84A6" font-size="7" font-weight="bold" text-anchor="middle">SOC V2.6</text>
    </g>
    
        <g>
            <rect x="80" y="55" width="220" height="70" fill="#0A0F1A" stroke="#22E1FF" stroke-width="1"/>
