<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" style="background-color:#04060D; font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', sans-serif;">
    
    <defs>
        <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="4" y2="0" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
        </pattern>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="40" height="40" fill="none" stroke="#22E1FF" stroke-opacity="0.04" stroke-width="1"/>
            <circle cx="40" cy="40" r="1" fill="#22E1FF" opacity="0.2"/>
        </pattern>
        <!-- 十六进制内存流底纹 (双副本保证 300px 无缝滚动) -->
        <pattern id="hex-rain" width="300" height="300" patternUnits="userSpaceOnUse">
            <g fill="#22E1FF" opacity="0.05" font-size="9" font-family="'JetBrains Mono', Consolas" letter-spacing="2">
                <text x="20" y="20">0x0800 0x1A2B 0x3C4D 0x5E6F</text>
                <text x="80" y="80">0x2000 0xDEAD 0xBEEF 0x0000</text>
                <text x="150" y="140">0x4002 0x8899 0xAABB 0xCCDD</text>
                <text x="40" y="220">0x8000 0x1122 0x3344 0x5566</text>
                <text x="200" y="280">0x0000 0xFFFF 0x0000 0xFFFF</text>
                <text x="20" y="-280">0x0800 0x1A2B 0x3C4D 0x5E6F</text>
                <text x="80" y="-220">0x2000 0xDEAD 0xBEEF 0x0000</text>
                <text x="150" y="-160">0x4002 0x8899 0xAABB 0xCCDD</text>
                <text x="40" y="-80">0x8000 0x1122 0x3344 0x5566</text>
                <text x="200" y="-20">0x0000 0xFFFF 0x0000 0xFFFF</text>
                <animateTransform attributeName="transform" type="translate" from="0,0" to="0,300" dur="20s" repeatCount="indefinite"/>
            </g>
        </pattern>
    </defs>
    
    <rect width="1200" height="340" fill="#04060D" />
    <!-- 巨型工业背景水印 -->
    <text x="600.0" y="270.0" fill="#FFFFFF" font-size="272.0" font-weight="900" font-family="Arial, Helvetica, sans-serif" opacity="0.02" text-anchor="middle" letter-spacing="-10">04</text>
    <!-- Hex 内存流与极客网格 -->
    <rect width="1200" height="340" fill="url(#hex-rain)" />
    <rect width="1200" height="340" fill="url(#grid)" />
    
    <path d="M 24,20 L 34,20 M 24,20 L 24,30 M 1176,20 L 1166,20 M 1176,20 L 1176,30" fill="none" stroke="#6F84A6" stroke-width="1"/>
    <text x="64" y="32" fill="#6F84A6" font-size="10" font-weight="bold" letter-spacing="2">SYS.ARCH // ORTHOGONAL PCB ROUTING</text>
    <text x="1168" y="40" fill="#6F84A6" font-size="8" text-anchor="end">JASMINE_SOC_REV_2.6</text>
    <line x1="24" y1="44" x2="1176" y2="44" stroke="#1B2740" stroke-width="1" stroke-dasharray="4 2"/>
    
    <!-- 连向 MCU (Cyan) -->
    <path d="M 600,160 L 600,120 L 570,90 L 300,90" fill="none" stroke="#22E1FF" stroke-width="2" stroke-dasharray="4 4">
        <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <!-- 连向 PERIPHERALS (Yellow) -->
    <path d="M 600,160 L 570,190 L 300,190" fill="none" stroke="#FFC247" stroke-width="2"/>
    <!-- 连向 MOTION (Yellow) -->
    <path d="M 600,160 L 600,270 L 580,290 L 300,290" fill="none" stroke="#FFC247" stroke-width="2"/>
