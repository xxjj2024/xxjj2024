<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="100%" height="100%" style="background-color:#04060D; font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', sans-serif;">
    
    <defs>
        <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="4" y2="0" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
        </pattern>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="40" height="40" fill="none" stroke="#22E1FF" stroke-opacity="0.04" stroke-width="1"/>
            <circle cx="40" cy="40" r="1" fill="#22E1FF" opacity="0.2"/>
        </pattern>
        <!-- 十六进制内存流底纹 (双副本保证 300px 无缝滚动) -->
        <pattern id="hex-rain" width="300" height="300" patternUnits="userSpaceOnUse">
            <g fill="#22E1FF" opacity="0.05" font-size="9" font-family="'JetBrains Mono', Consolas" letter-spacing="2">
                <text x="20" y="20">0x0800 0x1A2B 0x3C4D 0x5E6F</text>
                <text x="80" y="80">0x2000 0xDEAD 0xBEEF 0x0000</text>
                <text x="150" y="140">0x4002 0x8899 0xAABB 0xCCDD</text>
                <text x="40" y="220">0x8000 0x1122 0x3344 0x5566</text>
                <text x="200" y="280">0x0000 0xFFFF 0x0000 0xFFFF</text>
                <text x="20" y="-280">0x0800 0x1A2B 0x3C4D 0x5E6F</text>
                <text x="80" y="-220">0x2000 0xDEAD 0xBEEF 0x0000</text>
                <text x="150" y="-160">0x4002 0x8899 0xAABB 0xCCDD</text>
                <text x="40" y="-80">0x8000 0x1122 0x3344 0x5566</text>
                <text x="200" y="-20">0x0000 0xFFFF 0x0000 0xFFFF</text>
                <animateTransform attributeName="transform" type="translate" from="0,0" to="0,300" dur="20s" repeatCount="indefinite"/>
            </g>
        </pattern>
    </defs>
    
    <rect width="1200" height="210" fill="#04060D" />
    <!-- 巨型工业背景水印 -->
    <text x="600.0" y="205.0" fill="#FFFFFF" font-size="168.0" font-weight="900" font-family="Arial, Helvetica, sans-serif" opacity="0.02" text-anchor="middle" letter-spacing="-10">08</text>
    <!-- Hex 内存流与极客网格 -->
    <rect width="1200" height="210" fill="url(#hex-rain)" />
    <rect width="1200" height="210" fill="url(#grid)" />
    
    <!-- 中心花朵与旋转光环 -->
    <g transform="translate(600, 80)">
        <circle cx="0" cy="0" r="40" fill="none" stroke="#1B2740" stroke-width="2" stroke-dasharray="8 8">
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="3" fill="#FFC247" filter="url(#glow-cyan)">
            <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
        </circle>
        <!-- 极简花瓣 -->
        <path d="M0,-5 Q15,-20 0,-30 Q-15,-20 0,-5 M4,-2 Q18,-5 25,5 Q15,15 4,-2 M-4,-2 Q-18,-5 -25,5 Q-15,15 -4,-2 M3,4 Q10,18 0,25 Q-10,18 -3,4" fill="none" stroke="#22E1FF" stroke-width="1.5" />
    </g>
    
    <line x1="24" y1="80" x2="520" y2="80" stroke="#1B2740" stroke-width="1" />
    <line x1="680" y1="80" x2="1176" y2="80" stroke="#1B2740" stroke-width="1" />
    
    <text x="600" y="160" fill="#6F84A6" font-size="14" letter-spacing="2" text-anchor="middle">MAKE IT WORK, MAKE IT RIGHT, MAKE IT FAST.</text>
    <text x="600" y="180" fill="#1B2740" font-size="12" letter-spacing="1" text-anchor="middle">&lt; EOF /&gt;</text>
    
    <rect width="1200" height="210" fill="url(#scanlines)" pointer-events="none" />
    
    <!-- HUD Corners -->
    <path d="M 14,0 L 0,0 L 0,14 M 1186,0 L 1200,0 L 1200,14 M 1186,210 L 1200,210 L 1200,196 M 14,210 L 0,210 L 0,196" fill="none" stroke="#1B2740" stroke-width="2" />
    <!-- Calibration Crosshairs -->
    <path d="M 40,24 L 48,24 M 44,20 L 44,28" fill="none" stroke="#6F84A6" stroke-width="1.5"/>
    <path d="M 1152,24 L 1160,24 M 1156,20 L 1156,28" fill="none" stroke="#6F84A6" stroke-width="1.5"/>
    <path d="M 40,186 L 48,186 M 44,182 L 44,190" fill="none" stroke="#6F84A6" stroke-width="1.5"/>
    <path d="M 1152,186 L 1160,186 M 1156,182 L 1156,190" fill="none" stroke="#6F84A6" stroke-width="1.5"/>
    </svg>