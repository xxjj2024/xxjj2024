<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%" style="background-color:#04060D; font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', sans-serif;">
    
    <defs>
        <!-- 泛光滤镜 -->
        <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <!-- 沉浸式渐变遮罩 (用于平滑折线图) -->
        <linearGradient id="grad-cyan" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#22E1FF" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#22E1FF" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="grad-magenta" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FF2FA8" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#FF2FA8" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#A8FF5E" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#A8FF5E" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="grad-yellow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFC247" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#FFC247" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8B5CFF" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#8B5CFF" stop-opacity="0.0"/>
        </linearGradient>
        
        <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="4" y2="0" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
        </pattern>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="40" height="40" fill="none" stroke="#22E1FF" stroke-opacity="0.03" stroke-width="1"/>
        </pattern>
        <!-- 十六进制内存流底纹 (双副本保证 300px 无缝滚动) -->
        <pattern id="hex-rain" width="300" height="300" patternUnits="userSpaceOnUse">
            <g fill="#22E1FF" opacity="0.04" font-size="9" font-family="'JetBrains Mono', Consolas" letter-spacing="2">
                <text x="20" y="20">0x0800 0x1A2B 0x3C4D 0x5E6F</text>
                <text x="80" y="80">0x2000 0xDEAD 0xBEEF 0x0000</text>
                <text x="150" y="140">0x4002 0x8899 0xAABB 0xCCDD</text>
                <text x="40" y="220">0x8000 0x1122 0x3344 0x5566</text>
                <text x="200" y="280">0x0000 0xFFFF 0x0000 0xFFFF</text>
                <text x="20" y="-280">0x0800 0x1A2B 0x3C4D 0x5E6F</text>
                <text x="80" y="-220">0x2000 0xDEAD 0xBEEF 0x0000</text>
                <text x="150" y="-160">0x4002 0x8899 0xAABB 0xCCDD</text>
                <text x="40" y="-80">0x8000 0x1122 0x3344 0x5566</text>
                <text x="200" y="-20">0x0000 0xFFFF 0x0000 0xFFFF</text>
                <animateTransform attributeName="transform" type="translate" from="0,0" to="0,300" dur="20s" repeatCount="indefinite"/>
            </g>
        </pattern>
    </defs>
    
    <rect width="1200" height="240" fill="#04060D" />
    <!-- 巨型工业背景水印 -->
    <text x="600.0" y="220.0" fill="#FFFFFF" font-size="192.0" font-weight="900" font-family="Arial, Helvetica, sans-serif" opacity="0.02" text-anchor="middle" letter-spacing="-10">05</text>
    
    <!-- 全局微距网格与内存流 -->
    <rect width="1200" height="240" fill="url(#hex-rain)" />
    <rect width="1200" height="240" fill="url(#grid)" />
    
    <!-- 取景器物理边框 -->
    <rect x="8" y="8" width="1184" height="224" fill="none" stroke="#1B2740" stroke-width="1.5"/>
    <!-- 四角重装甲锁定框 -->
    <path d="M 8,40 L 8,8 L 40,8 M 1160,8 L 1192,8 L 1192,40 M 8,200 L 8,232 L 40,232 M 1160,232 L 1192,232 L 1192,200" fill="none" stroke="#22E1FF" stroke-width="2.5" opacity="0.7"/>
    
    <!-- 顶部状态栏元数据 -->
    <text x="18" y="22" fill="#6F84A6" font-size="9" letter-spacing="1">SYS.MNTR // LIVE FEED</text>
    <circle cx="1155" cy="18" r="3.5" fill="#FF2FA8">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="1165" y="22" fill="#FF2FA8" font-size="9" font-weight="bold" letter-spacing="1">REC</text>
    <text x="1135" y="22" fill="#6F84A6" font-size="9" text-anchor="end">UPLINK_ESTABLISHED</text>
    
    <text x="64" y="40" fill="#6F84A6" font-size="12" font-weight="bold" letter-spacing="2">ACCESSING_RECORDS // BUILDS</text>
        <g transform="translate(20.0, 50)">
            <rect x="0" y="0" width="360" height="160" fill="#0A0F1A" stroke="#1B2740" stroke-width="1"/>

            <path d="M -5,-5 L 10,-5 M -5,-5 L -5,10" fill="none" stroke="#22E1FF" stroke-width="2"/>
            <path d="M 365,-5 L 350,-5 M 365,-5 L 365,10" fill="none" stroke="#22E1FF" stroke-width="2"/>
            <path d="M -5,165 L 10,165 M -5,165 L -5,150" fill="none" stroke="#22E1FF" stroke-width="2"/>
            <path d="M 365,165 L 350,165 M 365,165 L 365,150" fill="none" stroke="#22E1FF" stroke-width="2"/>

            <clipPath id="clip-01">
                <rect x="0" y="0" width="360" height="160" />
            </clipPath>
            <g clip-path="url(#clip-01)">
                
        <g opacity="0.7">
            <rect x="0" y="0" width="360" height="40" fill="#22E1FF" fill-opacity="0.12" filter="url(#glow-cyan)">
                <animate attributeName="y" values="0; 120; 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
            </rect>
            <line x1="0" y1="0" x2="360" y2="0" stroke="#22E1FF" stroke-width="2" filter="url(#glow-cyan)">
                <animate attributeName="y1" values="0; 160; 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
                <animate attributeName="y2" values="0; 160; 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
            </line>
        </g>
        
            </g>

            <rect x="0" y="0" width="360" height="4" fill="#8B5CFF"/>
            <text x="16" y="35" fill="#FFC247" font-size="20" font-family="'JetBrains Mono', Consolas" font-weight="900">[01]</text>
            <text x="70" y="32" fill="#6F84A6" font-size="10" font-weight="bold">C++ / ROS2</text>
            <circle cx="340" cy="24" r="4" fill="#A8FF5E">
                <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/>
            </circle>

            <text x="16" y="75" fill="#FFFFFF" font-size="22" font-weight="900" letter-spacing="1">LASER-CANNON</text>
            <text x="16" y="105" fill="#22E1FF" font-size="13">基于 STM32 的双舵机蓝牙激光炮台控制系统</text>
            <text x="16" y="130" fill="#22E1FF" font-size="13">采用 180° 舵机及 360° 连续舵机构建双自由度</text>
            <line x1="16" y1="145" x2="344" y2="145" stroke="#1B2740" stroke-width="1" stroke-dasharray="2 2"/>
        </g>
        
        <g transform="translate(420.0, 50)">
            <rect x="0" y="0" width="360" height="160" fill="#0A0F1A" stroke="#1B2740" stroke-width="1"/>

            <path d="M -5,-5 L 10,-5 M -5,-5 L -5,10" fill="none" stroke="#22E1FF" stroke-width="2"/>
            <path d="M 365,-5 L 350,-5 M 365,-5 L 365,10" fill="none" stroke="#22E1FF" stroke-width="2"/>
            <path d="M -5,165 L 10,165 M -5,165 L -5,150" fill="none" stroke="#22E1FF" stroke-width="2"/>
            <path d="M 365,165 L 350,165 M 365,165 L 365,150" fill="none" stroke="#22E1FF" stroke-width="2"/>

            <clipPath id="clip-02">
                <rect x="0" y="0" width="360" height="160" />
            </clipPath>
            <g clip-path="url(#clip-02)">
                
        <g opacity="0.7">
            <rect x="0" y="0" width="360" height="40" fill="#22E1FF" fill-opacity="0.12" filter="url(#glow-cyan)">
                <animate attributeName="y" values="0; 120; 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
            </rect>
            <line x1="0" y1="0" x2="360" y2="0" stroke="#22E1FF" stroke-width="2" filter="url(#glow-cyan)">
                <animate attributeName="y1" values="0; 160; 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
                <animate attributeName="y2" values="0; 160; 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
            </line>
        </g>
        
            </g>

            <rect x="0" y="0" width="360" height="4" fill="#8B5CFF"/>
            <text x="16" y="35" fill="#FFC247" font-size="20" font-family="'JetBrains Mono', Consolas" font-weight="900">[02]</text>
            <text x="70" y="32" fill="#6F84A6" font-size="10" font-weight="bold">C / STM32</text>
            <circle cx="340" cy="24" r="4" fill="#A8FF5E">
                <animate attributeName="opacity" values="1;0.2;1" dur="3.0s" repeatCount="indefinite"/>
            </circle>

            <text x="16" y="75" fill="#FFFFFF" font-size="22" font-weight="900" letter-spacing="1">STEPPER-57</text>
            <text x="16" y="105" fill="#22E1FF" font-size="13">STM32F103C8T6 闭环 57 步电机的从 0 到 1</text>
            <text x="16" y="130" fill="#22E1FF" font-size="13">包含位置环与速度环 PID 调参实现</text>
            <line x1="16" y1="145" x2="344" y2="145" stroke="#1B2740" stroke-width="1" stroke-dasharray="2 2"/>
        </g>
        
        <g transform="translate(820.0, 50)">
            <rect x="0" y="0" width="360" height="160" fill="#0A0F1A" stroke="#1B2740" stroke-width="1"/>

            <path d="M -5,-5 L 10,-5 M -5,-5 L -5,10" fill="none" stroke="#22E1FF" stroke-width="2"/>
            <path d="M 365,-5 L 350,-5 M 365,-5 L 365,10" fill="none" stroke="#22E1FF" stroke-width="2"/>
            <path d="M -5,165 L 10,165 M -5,165 L -5,150" fill="none" stroke="#22E1FF" stroke-width="2"/>
            <path d="M 365,165 L 350,165 M 365,165 L 365,150" fill="none" stroke="#22E1FF" stroke-width="2"/>

            <clipPath id="clip-03">
                <rect x="0" y="0" width="360" height="160" />
            </clipPath>
            <g clip-path="url(#clip-03)">
                
        <g opacity="0.7">
            <rect x="0" y="0" width="360" height="40" fill="#22E1FF" fill-opacity="0.12" filter="url(#glow-cyan)">
                <animate attributeName="y" values="0; 120; 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
            </rect>
            <line x1="0" y1="0" x2="360" y2="0" stroke="#22E1FF" stroke-width="2" filter="url(#glow-cyan)">
                <animate attributeName="y1" values="0; 160; 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
                <animate attributeName="y2" values="0; 160; 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
            </line>
        </g>
        
            </g>

            <rect x="0" y="0" width="360" height="4" fill="#8B5CFF"/>
            <text x="16" y="35" fill="#FFC247" font-size="20" font-family="'JetBrains Mono', Consolas" font-weight="900">[03]</text>
            <text x="70" y="32" fill="#6F84A6" font-size="10" font-weight="bold">PYTHON</text>
            <circle cx="340" cy="24" r="4" fill="#A8FF5E">
                <animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/>
            </circle>

            <text x="16" y="75" fill="#FFFFFF" font-size="22" font-weight="900" letter-spacing="1">VIBE-AWARDS</text>
            <text x="16" y="105" fill="#22E1FF" font-size="13">基于视觉大模型的视频解析与二次创作</text>
            <text x="16" y="130" fill="#22E1FF" font-size="13">集成自动化剪辑与弹幕渲染模块</text>
            <line x1="16" y1="145" x2="344" y2="145" stroke="#1B2740" stroke-width="1" stroke-dasharray="2 2"/>
        </g>
        
    <rect width="1200" height="240" fill="url(#scanlines)" pointer-events="none" />
    </svg>