<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 392" width="100%" height="100%" style="background-color:#04060D; font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', sans-serif;">
    
    <defs>
        <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="4" y2="0" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
        </pattern>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="40" height="40" fill="none" stroke="#22E1FF" stroke-opacity="0.06" stroke-width="1"/>
        </pattern>
    </defs>
    
    <rect width="1200" height="392" fill="#04060D" />
    <rect width="1200" height="392" fill="url(#grid)" />
    
    <rect x="24" y="24" width="1152" height="344" fill="#0A0F1A" stroke="#1B2740" stroke-width="1" stroke-dasharray="4 4" rx="14"/>
    <text x="600" y="196.0" fill="#6F84A6" font-size="16" letter-spacing="4" text-anchor="middle" font-weight="bold">MODULE [RECENT_BUILDS] : INITIALIZING...</text>
    <circle cx="1152" cy="48" r="4" fill="#FFC247">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <rect width="1200" height="392" fill="url(#scanlines)" pointer-events="none" />
    <!-- HUD Corners -->
    <path d="M 14,0 L 0,0 L 0,14 M 1186,0 L 1200,0 L 1200,14 M 1186,392 L 1200,392 L 1200,378 M 14,392 L 0,392 L 0,378" fill="none" stroke="#1B2740" stroke-width="2" />
    </svg>