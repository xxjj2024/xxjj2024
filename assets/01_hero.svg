<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%" style="background-color:#04060D; font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', sans-serif;">
    
    <defs>
        <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="4" y2="0" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
        </pattern>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="40" height="40" fill="none" stroke="#22E1FF" stroke-opacity="0.06" stroke-width="1"/>
        </pattern>
    </defs>
    
    <rect width="1200" height="560" fill="#04060D" />
    <rect width="1200" height="560" fill="url(#grid)" />
    
    <text x="32" y="40" fill="#22E1FF" font-size="12" font-weight="bold" letter-spacing="2">● JASMINE//OS · PROFILE v2.6</text>
    <text x="1168" y="40" fill="#6F84A6" font-size="12" letter-spacing="1" text-anchor="end">CH1 500mV/div CH2 1V/div RUN &#9656;</text>
    <line x1="24" y1="60" x2="1176" y2="60" stroke="#1B2740" stroke-width="1" />
    
    <g transform="translate(48, 220)">
        <text x="0" y="0" fill="#FF2FA8" font-size="110" font-weight="900" letter-spacing="-2">
            JasmineX
            <animateTransform attributeName="transform" type="translate" values="4,0; 4,4; -2,-2; 4,0" keyTimes="0; 0.1; 0.2; 1" dur="3.7s" calcMode="discrete" repeatCount="indefinite"/>
        </text>
        <text x="0" y="0" fill="#22E1FF" font-size="110" font-weight="900" letter-spacing="-2">
            JasmineX
            <animateTransform attributeName="transform" type="translate" values="-4,0; -4,-4; 2,2; -4,0" keyTimes="0; 0.1; 0.2; 1" dur="5.2s" calcMode="discrete" repeatCount="indefinite"/>
        </text>
        <text x="0" y="0" fill="#FFFFFF" font-size="110" font-weight="900" letter-spacing="-2">JasmineX</text>
    </g>
    
    <g transform="translate(52, 280)">
        <clipPath id="type-clip">
            <rect x="0" y="-20" width="0" height="40">
                <animate attributeName="width" from="0" to="600" dur="2.6s" fill="freeze" />
            </rect>
        </clipPath>
        <text x="0" y="0" fill="#6F84A6" font-size="16" clip-path="url(#type-clip)">&gt; 让电机转准，让代码跑稳，让画面剪好。</text>
        <!-- 闪烁光标 -->
        <rect x="340" y="-14" width="8" height="18" fill="#FFC247">
            <animate attributeName="opacity" values="1;0;1" dur="1.05s" calcMode="discrete" repeatCount="indefinite"/>
        </rect>
    </g>
    
    <g transform="translate(0, 420)">
        <line x1="24" y1="0" x2="1176" y2="0" stroke="#FFC247" stroke-width="1" stroke-dasharray="4 4" />
        <text x="32" y="-8" fill="#FFC247" font-size="10" letter-spacing="1">TRIG 50%</text>
        <!-- 滚动的 PWM 方波 -->
        <g stroke="#22E1FF" stroke-width="2" fill="none" filter="url(#glow-cyan)">
            <path d="M0,40 L40,40 L40,-40 L80,-40 L80,40 L120,40 L120,-40 L160,-40 L160,40 L200,40 L200,-40 L240,-40 L240,40 L280,40 L280,-40 L320,-40 L320,40 L360,40 L360,-40 L400,-40 L400,40 L440,40 L440,-40 L480,-40 L480,40 L520,40 L520,-40 L560,-40 L560,40 L600,40 L600,-40 L640,-40 L640,40 L680,40 L680,-40 L720,-40 L720,40 L760,40 L760,-40 L800,-40 L800,40 L840,40 L840,-40 L880,-40 L880,40 L920,40 L920,-40 L960,-40 L960,40 L1000,40 L1000,-40 L1040,-40 L1040,40 L1080,40 L1080,-40 L1120,-40 L1120,40 L1160,40 L1160,-40 L1200,-40 L1200,40 L1240,40 L1240,-40 L1280,-40">
                <animateTransform attributeName="transform" type="translate" from="0,0" to="-80,0" dur="1.2s" repeatCount="indefinite" />
            </path>
        </g>
    </g>
    
    <rect width="1200" height="560" fill="url(#scanlines)" pointer-events="none" />
    <!-- HUD Corners -->
    <path d="M 14,0 L 0,0 L 0,14 M 1186,0 L 1200,0 L 1200,14 M 1186,560 L 1200,560 L 1200,546 M 14,560 L 0,560 L 0,546" fill="none" stroke="#1B2740" stroke-width="2" />
    </svg>