<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%" style="background-color:#04060D; font-family: 'JetBrains Mono', Consolas, 'Microsoft YaHei', sans-serif;">
    
    <defs>
        <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="4" y2="0" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
        </pattern>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="40" height="40" fill="none" stroke="#22E1FF" stroke-opacity="0.04" stroke-width="1"/>
        </pattern>
    </defs>
    
    <rect width="1200" height="560" fill="#04060D" />
    <!-- 巨型工业背景水印 -->
    <text x="600.0" y="380.0" fill="#FFFFFF" font-size="448.0" font-weight="900" font-family="Arial, Helvetica, sans-serif" opacity="0.02" text-anchor="middle" letter-spacing="-10">01</text>
    <rect width="1200" height="560" fill="url(#grid)" />
    
    <text x="32" y="40" fill="#22E1FF" font-size="12" font-weight="bold" letter-spacing="2">● JASMINE//OS · PROFILE v2.6</text>
    <text x="1168" y="40" fill="#6F84A6" font-size="12" letter-spacing="1" text-anchor="end">CH1 500mV/div CH2 1V/div RUN &#9656;</text>
    <line x1="24" y1="60" x2="1176" y2="60" stroke="#1B2740" stroke-width="1" />
    
    <g transform="translate(48, 220)">
        <text x="0" y="0" fill="#FF2FA8" font-size="96" font-weight="700" letter-spacing="-2">
            JasmineX
            <animateTransform attributeName="transform" type="translate" values="4,0; 4,4; -2,-2; 4,0" keyTimes="0; 0.1; 0.2; 1" dur="3.7s" calcMode="discrete" repeatCount="indefinite"/>
        </text>
        <text x="0" y="0" fill="#22E1FF" font-size="96" font-weight="700" letter-spacing="-2">
            JasmineX
            <animateTransform attributeName="transform" type="translate" values="-4,0; -4,-4; 2,2; -4,0" keyTimes="0; 0.1; 0.2; 1" dur="5.2s" calcMode="discrete" repeatCount="indefinite"/>
        </text>
        <text x="0" y="0" fill="#FFFFFF" font-size="96" font-weight="700" letter-spacing="-2">JasmineX</text>
    </g>
    
    <g transform="translate(52, 280)">
        <clipPath id="type-clip">
            <rect x="0" y="-20" width="0" height="40">
                <animate attributeName="width" from="0" to="600" dur="2.6s" fill="freeze" />
            </rect>
        </clipPath>
        <text x="0" y="0" fill="#6F84A6" font-size="16" clip-path="url(#type-clip)">&gt; 让电机转准，让代码跑稳，让画面剪好。</text>
        <!-- 闪烁光标 -->
        <rect x="340" y="-14" width="8" height="18" fill="#FFC247">
            <animate attributeName="opacity" values="1;0;1" dur="1.05s" calcMode="discrete" repeatCount="indefinite"/>
        </rect>
    </g>
    
    <g transform="translate(0, 420)">
        <line x1="24" y1="0" x2="800" y2="0" stroke="#FFC247" stroke-width="1" stroke-dasharray="2 4" />
        <text x="32" y="-8" fill="#FFC247" font-size="10" letter-spacing="1">PHASE.SYNC // LISSAJOUS RESONANCE</text>
        
        <!-- 主载波 (Cyan) -->
        <g stroke="#22E1FF" stroke-width="1.5" fill="none" filter="url(#glow-cyan)">
            <path d="M0,0 Q50,-50 100,0 T200,0 T300,0 T400,0 T500,0 T600,0 T700,0 T800,0 T900,0 T1000,0">
                <animateTransform attributeName="transform" type="translate" from="0,0" to="-200,0" dur="4s" repeatCount="indefinite" />
            </path>
        </g>
        <!-- 副频波 (Magenta, 逆向) -->
        <g stroke="#FF2FA8" stroke-width="1" fill="none" opacity="0.6">
            <path d="M-200,0 Q-150,30 -100,0 T0,0 T100,0 T200,0 T300,0 T400,0 T500,0 T600,0 T700,0 T800,0 T900,0 T1000,0">
                <animateTransform attributeName="transform" type="translate" from="0,0" to="200,0" dur="6s" repeatCount="indefinite" />
            </path>
        </g>
        <!-- 扫频扫描线 -->
        <line x1="200" y1="-60" x2="200" y2="60" stroke="#FFFFFF" stroke-width="1" opacity="0.5">
            <animate attributeName="x1" values="50; 800; 50" dur="8s" repeatCount="indefinite"/>
            <animate attributeName="x2" values="50; 800; 50" dur="8s" repeatCount="indefinite"/>
        </line>
    </g>
    
    <g transform="translate(1000, 420)">
        <text x="0" y="-85" fill="#6F84A6" font-size="10" font-weight="bold" text-anchor="middle">TARGET_LOCK</text>
        <!-- 外层刻度慢速顺时针 -->
        <circle cx="0" cy="0" r="70" fill="none" stroke="#1B2740" stroke-width="6" stroke-dasharray="2 8">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
        </circle>
        <!-- 中层瞄准环快速逆时针 -->
        <circle cx="0" cy="0" r="55" fill="none" stroke="#22E1FF" stroke-width="2" stroke-dasharray="10 20 40 10 5 15" filter="url(#glow-cyan)">
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
        </circle>
        <!-- 内层能量环脉冲 -->
        <circle cx="0" cy="0" r="40" fill="none" stroke="#FF2FA8" stroke-width="1.5" stroke-dasharray="40 80" filter="url(#glow-magenta)">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
        </circle>
        <!-- 核心十字准心 -->
        <path d="M -15,0 L 15,0 M 0,-15 L 0,15" fill="none" stroke="#FFC247" stroke-width="1"/>
        <circle cx="0" cy="0" r="3" fill="#FFC247" filter="url(#glow-cyan)">
             <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
    </g>
    
    <rect width="1200" height="560" fill="url(#scanlines)" pointer-events="none" />
    
    <!-- HUD Corners -->
    <path d="M 14,0 L 0,0 L 0,14 M 1186,0 L 1200,0 L 1200,14 M 1186,560 L 1200,560 L 1200,546 M 14,560 L 0,560 L 0,546" fill="none" stroke="#1B2740" stroke-width="2" />
    <!-- Calibration Crosshairs -->
    <path d="M 40,24 L 48,24 M 44,20 L 44,28" fill="none" stroke="#6F84A6" stroke-width="1.5"/>
    <path d="M 1152,24 L 1160,24 M 1156,20 L 1156,28" fill="none" stroke="#6F84A6" stroke-width="1.5"/>
    <path d="M 40,548 L 48,548 M 44,544 L 44,552" fill="none" stroke="#6F84A6" stroke-width="1.5"/>
    <path d="M 1152,548 L 1160,548 M 1156,544 L 1156,552" fill="none" stroke="#6F84A6" stroke-width="1.5"/>
    </svg>