name: JASMINE//OS Daily Build

on:
  schedule:
    - cron: "0 19 * * *" # 每天北京时间 03:00 运行
  workflow_dispatch:     # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Fetch Telemetry Data
        run: python scripts/fetch_data.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Render Terminal SVG
        run: python scripts/render.py
        
      - name: Commit & Push Changes
        run: |
          git config --global user.name 'jasmine-os-bot'
          git config --global user.email 'bot@jasmine-os.local'
          git add assets/ data/
          git commit -m "chore(ui): refresh terminal state & telemetry [skip ci]" || exit 0
          git push
